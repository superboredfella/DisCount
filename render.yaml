# Free deployment on Render — https://render.com
# 1. Push this repo to GitHub
# 2. Render Dashboard → New → Blueprint → connect repo
# 3. Share your app URL with friends!
#
# Free tier notes:
# - No persistent disk (data may reset on redeploy)
# - Service sleeps after ~15 min idle; visiting the URL wakes it up (~30–60s)

services:
  - type: web
    name: discont
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run dev
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
